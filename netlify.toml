# Community OS (Next.js App Router) lives in web/.
#
# Root cause of the site-wide 404: deploys uploaded `.next` as static files with
# "No functions deployed". App Router SSR needs the Next.js OpenNext adapter to
# provision Netlify Functions. Declare the plugin explicitly so the adapter
# always runs for this monorepo layout.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.12.0"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Sync now used to run the entire Drive walk inside one invocation. Netlify
# kills that function (often as a browser 502) once it passes the plan limit.
# 26s is the usual synchronous cap; the app also chunks work at 8s so a 10s
# plan still finishes a step and continues.
[functions]
  timeout = 26
